backend:
  name: github
  repo: seppukuuu/portfolio
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth

media_folder: uploads
public_folder: /uploads

collections:
  - name: portfolio
    label: Portfolio
    files:
      - name: projects
        label: Projects
        file: content/projects.json
        format: json
        fields:
          - label: Projects
            name: projects
            widget: list
            summary: "{{fields.title}}"
            fields:
              - label: Title
                name: title
                widget: string
              - label: Type
                name: tag
                widget: string
              - label: Year
                name: year
                widget: string
              - label: Short description
                name: desc
                widget: text
                required: false
              - label: Content blocks
                name: blocks
                widget: list
                required: false
                fields:
                  - label: Block type
                    name: type
                    widget: select
                    options:
                      - { label: Heading, value: heading }
                      - { label: Text, value: text }
                      - { label: Image, value: image }
                      - { label: Video, value: video }
                  - label: Text
                    name: text
                    widget: text
                    required: false
                  - label: Image or video file
                    name: file
                    widget: file
                    required: false
                  - label: Width
                    name: w
                    widget: select
                    options:
                      - { label: Full width, value: full }
                      - { label: Half width, value: half }
                    default: full
                  - label: Use as project cover
                    name: cover
                    widget: boolean
                    required: false
